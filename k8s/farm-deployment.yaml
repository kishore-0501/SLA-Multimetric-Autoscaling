apiVersion: apps/v1
kind: Deployment

metadata:
  name: farm-app
  namespace: sla-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: farm-app

  template:
    metadata:
      labels:
        app: farm-app

    spec:
      containers:
      - name: farm
        image: 562460196113.dkr.ecr.eu-west-1.amazonaws.com/farm:latest

        ports:
        - containerPort: 8000

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"
