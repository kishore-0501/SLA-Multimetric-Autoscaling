apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-auto-load
  namespace: sla-demo

spec:

  schedule: "*/5 * * * *"

  concurrencyPolicy: Forbid

  jobTemplate:

    spec:
      backoffLimit: 0

      template:

        spec:

          restartPolicy: Never

          containers:

          - name: k6

            image: grafana/k6:latest

            command:
            - k6

            args:
            - run
            - /scripts/loadtest.js

            volumeMounts:
            - name: k6-script
              mountPath: /scripts


          volumes:

          - name: k6-script

            configMap:

              name: k6-script